name: Tests
# The safety tests (the RAW is never changed, sidecars merge and undo correctly) on every push.
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install rawpy numpy opencv-python-headless pytest
      - run: python -m pytest -q tests
